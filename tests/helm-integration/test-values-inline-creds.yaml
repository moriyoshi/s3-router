# Test values for inline backend credentials tests
# This file configures backends with inline credentials to verify:
# - Secrets are created with backend-{name}.json keys
# - Pod mounts the backend-credentials volume
# - ConfigMap rewrites inline credentials to file type

replicaCount: 1

image:
  repository: s3-router
  pullPolicy: Never
  tag: "integration-test"

podAnnotations: {}

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Credentials for s3-router principals
credentials:
  test:
    secret_key: test
    enabled: true
    created_at: "2024-01-01T00:00:00Z"

# Configuration for s3-router
config:
  featureFlags:
    enable_caching: true
    enable_metrics: true

  # Test backends with inline credentials
  backends:
    inline-backend1:
      endpoint: http://moto.s3-router-test.svc.cluster.local:5000
      bucket: test-bucket-1
      credentials:
        type: inline
        access_key_id: AKIAIOSFODNN7EXAMPLE1
        secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY1

    inline-backend2:
      endpoint: http://moto.s3-router-test.svc.cluster.local:5000
      bucket: test-bucket-2
      credentials:
        type: inline
        access_key_id: AKIAIOSFODNN7EXAMPLE2
        secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY2
        session_token: FwoGZXIvYXdzEBYaDExxxxxxxxxx

  # Test routing rules
  buckets:
    - name: test-bucket
      routes:
        - path: ^bucket1/(.*)
          backend: inline-backend1
          rewrite:
            - result: $1
        - path: ^bucket2/(.*)
          backend: inline-backend2
          rewrite:
            - result: $1

server:
  listenPort: 8080
  adminPort: 9090

livenessProbe:
  httpGet:
    path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 5

readinessProbe:
  httpGet:
    path: /healthz
  initialDelaySeconds: 3
  periodSeconds: 3
