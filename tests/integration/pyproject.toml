[project]
name = "s3-router-integration-tests"
version = "0.1.0"
description = "Integration tests for s3-router"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.42",
    "filelock>=3.20",
    "moto[s3,server]>=5.1",
    "pytest-cov>=7",
    "pytest>=9,<10",
    "pyyaml>=6",
    "pytest-xdist>=3",
    "requests>=2.32",
    "minio>=7.2.20",
]

[dependency-groups]
dev = [
    "minio>=7.2.20",
    "mypy>=1.19.0",
    "ruff>=0.14.0",
    "types-boto3[s3]>=1.42.0",
    "types-PyYAML>=6",
    "types-requests>=2.32",
]

[tool.ruff]
line-length = 140
