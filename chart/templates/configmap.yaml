apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "s3-router.fullname" . }}-config
  labels:
    {{- include "s3-router.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- if .Values.config.backends }}
    backends:
      {{- range $backendName, $backendConfig := .Values.config.backends }}
      {{ $backendName }}:
        {{- if $backendConfig.endpoint }}
        endpoint: {{ $backendConfig.endpoint }}
        {{- end }}
        {{- if $backendConfig.bucket }}
        bucket: {{ $backendConfig.bucket }}
        {{- end }}
        {{- if $backendConfig.prefix }}
        prefix: {{ $backendConfig.prefix }}
        {{- end }}
        {{- if $backendConfig.timeout }}
        timeout: {{ $backendConfig.timeout }}
        {{- end }}
        {{- if $backendConfig.retries }}
        retries: {{ $backendConfig.retries }}
        {{- end }}
        {{- if $backendConfig.credentials }}
        credentials:
          {{- if eq (default "" $backendConfig.credentials.type) "inline" }}
          type: file
          path: /etc/s3router/backend-credentials/backend-{{ $backendName }}.json
          {{- else }}
          {{- toYaml $backendConfig.credentials | nindent 10 }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- if .Values.config.buckets }}
    buckets:
      {{- toYaml .Values.config.buckets | nindent 6 }}
    {{- end }}
    {{- if .Values.config.features }}
    features:
      {{- toYaml .Values.config.features | nindent 6 }}
    {{- end }}
    {{- if .Values.config.auth }}
    auth:
      {{- toYaml .Values.config.auth | nindent 6 }}
    {{- end }}
    {{- if .Values.config.server }}
    server:
      {{- toYaml .Values.config.server | nindent 6 }}
    {{- end }}
    {{- if .Values.virtualHosts }}
    virtual_hosts:
      {{- toYaml .Values.virtualHosts | nindent 6 }}
    {{- end }}
    credentials_store: /etc/s3router/credentials/credentials.json
