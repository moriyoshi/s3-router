[project]
name = "s3-router-helm-integration-tests"
version = "0.1.0"
description = "Helm integration tests for s3-router"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.42",
    "kubernetes>=35,<36",
    "moto[s3,server]>=5.1",
    "pytest-asyncio>=1.3,<1.4",
    "pytest>=9,<10",
    "pyyaml>=6",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "ruff>=0.14.0",
    "types-boto3[s3]>=1.42",
    "types-PyYAML>=6",
    "types-requests>=2.32",
]

[tool.ruff]
line-length = 140
