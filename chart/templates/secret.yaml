apiVersion: v1
kind: Secret
metadata:
  name: {{ include "s3-router.fullname" . }}-credentials
  labels:
    {{- include "s3-router.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.credentials }}
  credentials.json: {{ .Values.credentials | toJson | b64enc }}
  {{- else }}
  # Default empty credentials
  credentials.json: {{ "{}" | b64enc }}
  {{- end }}
  {{- /* Extract inline credentials from backends and store as separate files */ -}}
  {{- range $backendName, $backendConfig := .Values.config.backends }}
  {{- if $backendConfig.credentials }}
  {{- if eq (default "" $backendConfig.credentials.type) "inline" }}
  backend-{{ $backendName }}.json: {{ dict "access_key_id" $backendConfig.credentials.access_key_id "secret_access_key" $backendConfig.credentials.secret_access_key "session_token" (default "" $backendConfig.credentials.session_token) | toJson | b64enc }}
  {{- end }}
  {{- end }}
  {{- end }}
