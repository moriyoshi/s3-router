name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.8.0
          args: ./...
      - name: Run gofmt
        run: gofmt -l -w .

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run unit tests
        run: make test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.14
      - name: Run integration tests
        run: make integration-test

  helm-integration-tests:
    name: Helm integration tests
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.files.*.path, 'chart/')
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.14
      - name: Install kind
        run: |
          if [ ! -f /usr/local/bin/kind ]; then
            cd /tmp
            curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
            cat > kind-v0.24.0.sha256sum <<'HERE'
            b89aada5a39d620da3fcd16435b7f28d858927dd53f92cbac77686b0588b600d  kind-linux-amd64
          HERE
            sha256sum -c ./kind-v0.24.0.sha256sum
            sudo install -m 0755 ./kind /usr/local/bin/kind
            rm -f ./kind ./kind.sha256sum
          fi
      - name: Install helm
        run: |
          if [ ! -f /usr/local/bin/helm ]; then
            cd /tmp
            curl -Lo ./helm-v4.1.0-linux-amd64.tar.gz https://get.helm.sh/helm-v4.1.0-linux-amd64.tar.gz 
            cat > helm-v4.1.0-linux-amd64.tar.gz.sha256sum <<'HERE'
            8e7ae5cb890c56f53713bffec38e41cd8e7e4619ebe56f8b31cd383bfb3dbb83  helm-v4.1.0-linux-amd64.tar.gz
          HERE
            sha256sum -c ./helm-v4.1.0-linux-amd64.tar.gz.sha256sum
            tar xfv helm-v4.1.0-linux-amd64.tar.gz
            sudo install -m 0755 ./linux-amd64/helm /usr/local/bin/helm
            rm -rf ./helm-v4.1.0-linux-amd64.tar.gz ./helm-v4.1.0-linux-amd64.tar.gz.sha256sum ./linux-amd64
          fi
      - name: Run Helm integration tests
        run: make helm-integration-test
